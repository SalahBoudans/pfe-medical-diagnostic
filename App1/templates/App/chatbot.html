{% extends "layout.html" %}

{% block style %}
    {% comment %} {% load static %} {% endcomment %}
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">
    <style>
        .user_img,
        .user_img_msg {
            width: 70px;
            height: 60px;
            border-radius: 15px;
        }

        .img_cont,
        .img_cont_msg {
            width: 50px;
            height: 50px;
        }
        .my_img{
            padding-right: 20px;
            padding-bottom: 10px;
            padding-top : 0px ;
        }
        .user_info{
            margin-left: 20px;
        }
        {% comment %} .msg_time_send,.msg_time{
            margin-left:8px;
        } {% endcomment %}
        .msg_cotainer_send{
            padding-right: 10px;
            padding-top: 14px;
        }
        p{
            margin-bottom: 0;
        }
        .msg_cotainer{
            padding-left: 11px;
            padding-top: 14px;
        }
    </style>
{% endblock %}

{% block title %} Chatbot{%endblock%}
{% block content %}
    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">        
            <div class="col-md-8 col-xl-6 chat">
                <div class="card">
                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight">
                            <div class="img_cont">
                                <img src="https://i.ibb.co/fSNP7Rz/icons8-chatgpt-512.png" class="my_img user_img">
                                <span class="online_icon"></span>
                            </div>
                            <div class="user_info">
                                <span>ChatBot</span>
                                <p>Ask me anything!</p>
                            </div>
                        </div>
                    </div>
                    <div id="messageFormeight" class="card-body msg_card_body">                        
                    </div>
                    <div class="card-footer">
                        <form id="messageArea" class="input-group">
                            {% csrf_token %}
                            <input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off" class="form-control type_msg" required/>
                            <div class="input-group-append">
                                <button type="submit" id="send" class="input-group-text send_btn"><i class="fas fa-location-arrow"></i></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    $(document).ready(function(){
        $("#messageArea").on("submit", function(event) {
            event.preventDefault();
            const date = new Date();
            const hour = date.getHours();
            const minute = date.getMinutes();
            const str_time = hour + ":" + (minute < 10 ? "0" : "") + minute;
            var rawText = $("#text").val();

            var userHtml = '<div class="d-flex justify-content-end mb-4"><div class="msg_cotainer_send">' + '<p>'+rawText +'</p>'+ '</div><div class="img_cont_msg"><img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="my_img user_img_msg">'+'<span class="msg_time_send">'+ str_time + '</span></div></div>';
            
            $("#text").val("");
            $("#messageFormeight").append(userHtml);

            $.ajax({
                type: 'POST',
                url: '/chatbot',
                data: {
                    'msg': rawText,
                    'csrfmiddlewaretoken': $('input[name=csrfmiddlewaretoken]').val()
                },
                success: function(response){
                    var botHtml = '<div class="d-flex justify-content-start mb-4"><div class="img_cont_msg"><img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="my_img user_img_msg">'+'<span class="msg_time">' + str_time + '</span>'+'</div><div class="msg_cotainer"> <p>' + response.response + ' </p></div></div>';                    $('#messageFormeight').append(botHtml);
                }
            });
        });
    });
    </script>
{%endblock%}
