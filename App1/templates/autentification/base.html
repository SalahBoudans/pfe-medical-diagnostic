<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Font Awesome -->
    <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
    href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
    rel="stylesheet"
    />
    <!-- MDB -->
    <link
    href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/5.0.0/mdb.min.css"
    rel="stylesheet"
    />
    <title>Register Page</title>
</head>
<body>
    <section class="vh-100" style="background-color: #eee">
    <div class="container h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-lg-12 col-xl-11">
            <div class="card text-black" style="border-radius: 25px">
            <div class="card-body p-md-5">
                <div class="row justify-content-center">
                    <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">
                        {% block content %}
                        {% endblock  %}
                    </div>
                    <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">
                        <!-- <img
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGjU3oHTHxtXvZRfsHzEw_SGzTU2c-F-UVeg&usqp=CAU"
                        class="img-fluid"
                        alt="Sample image" style="width: 70%;"
                        /> -->
                        {% load static %}
                        <img src="{% static 'images/my_img.jpg' %}" class="img_p mx-auto d-block" alt="pneumonia" style="width: 100%;border-radius: 15px;height: 350px;">

                    </div>
                </div>
            </div>
            </div>
        </div>
        </div>
    </div>
    </section>
<!-- MDB -->
<script
    type="text/javascript"
    src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/5.0.0/mdb.min.js">
</script>
</body>
</html>
